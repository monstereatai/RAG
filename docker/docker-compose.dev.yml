# ============================================================
# RAG 项目开发环境（docker-compose.dev.yml）
# 包含：PostgreSQL + Redis + Milvus + Elasticsearch
# 使用：cd docker && docker compose -f docker-compose.dev.yml up -d
# 热重载：后端 npm run start:dev / 前端 npm run dev（宿主机运行）
#
# ⚠️ 注意：本文件与 docker-compose.yml 同目录，compose 项目名都取目录名 `docker`，
#    且两份文件的服务名完全相同（postgres / redis / etcd / minio / milvus / ...），
#    仅 container_name（rag-* 与 rag-dev-*）与数据卷前缀（docker_* 与 docker_dev_*）不同。
#    后果：同一时间只应启用其中一份，否则 compose 会把另一份的容器当成 orphan，
#    带 --remove-orphans 时还会去停掉另一套。
#    推荐用法：
#      - 只跑基础栈：cd docker && docker compose up -d
#      - 只跑 dev 栈：cd docker && docker compose -f docker-compose.dev.yml up -d
#      - 要组合时显式叠加：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#    切勿 docker compose down -v（会删数据卷）；停服务时按容器名精确停。
# ============================================================

services:
  # ---- PostgreSQL 16 + pgvector（关系型数据 + 可选向量库）----
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: rag-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      - '5432:5432'
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rag']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Redis 7（对话历史 + 缓存）----
  redis:
    image: redis:7.4.9-alpine
    container_name: rag-dev-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Milvus 依赖：etcd ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-dev-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - dev_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ['CMD', '/bin/sh', '-c', 'ETCDCTL_API=3 etcdctl endpoint health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Milvus 依赖：minio（对象存储）----
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - '9001:9001'
    volumes:
      - dev_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Milvus 2.4 standalone（向量库）----
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: rag-dev-milvus
    restart: unless-stopped
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - '19530:19530'
      - '9091:9091'
    volumes:
      - dev_milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---- Elasticsearch 8（全文检索，IK 中文分词）----
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: rag-dev-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=rag-dev
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - dev_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9200/_cluster/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---- Neo4j 5（知识图谱 GraphRAG，profile=graphrag 可选启动）----
  neo4j:
    image: neo4j:5.26.27-community
    container_name: rag-dev-neo4j
    restart: unless-stopped
    profiles:
      - graphrag
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - '7474:7474'   # HTTP Browser
      - '7687:7687'   # Bolt
    volumes:
      - dev_neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_etcd_data:
  dev_minio_data:
  dev_milvus_data:
  dev_es_data:
  dev_neo4j_data:


version: '3.8'

services:
  # 主应用
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nestjs-enterprise
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENABLE_DATABASE=true
      - ENABLE_REDIS=true
      - ENABLE_QUEUE=true
      - RUN_MIGRATIONS=true
      - DB_HOST=mysql-master
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-dev_password123}
      - DB_DATABASE=nestjs_enterprise_dev
      - DB_SYNCHRONIZE=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:-change-me-in-local-compose-min-32-chars}
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/var/log/nestjs
      - ./config:/app/config
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # MySQL主库
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-dev_password123}
      - MYSQL_DATABASE=nestjs_enterprise_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./mysql/master-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # MySQL从库
  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-dev_password123}
      - MYSQL_DATABASE=nestjs_enterprise_dev
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./mysql/slave-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      mysql-master:
        condition: service_healthy

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-network
    restart: unless-stopped

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Nginx负载均衡器
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

  # 监控 - Prometheus
  #
  # 注意：本服务默认不启动（profile: admin-monitoring）。
  # 原因：它用的是通用镜像名 prom/prometheus、容器名固定为 prometheus、映射 9090 端口，
  # 与仓库根目录 monitoring/docker-compose.monitoring.yml 里的 rag-prometheus 完全冲突
  # （同样 9090、同样 grafana 端口）。两套监控只应启用一套，默认启用根目录那套。
  # 需要用这一套时：
  #   docker compose -f docker/docker-compose.yml --profile admin-monitoring up -d
  # 同时记得停掉另一套（不要两套并存）。
  prometheus:
    profiles: ['admin-monitoring']
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - app-network
    restart: unless-stopped

  # 监控 - Grafana
  #
  # 同样默认不启动（profile: admin-monitoring）：容器名固定 grafana、映射 3000，
  # 会与宿主机上 RAG 后端 dev 端口 3000（以及根目录那套 grafana 的 3030）撞车。
  grafana:
    profiles: ['admin-monitoring']
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mysql-master-data:
  mysql-slave-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

networks:
  app-network:
    driver: bridge

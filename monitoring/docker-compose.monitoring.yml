# 一键起 Prometheus + Grafana（本地开发）
#
#   cd monitoring && docker compose -f docker-compose.monitoring.yml up -d
#
# 抓取宿主机上的服务，需要解决容器内如何访问宿主机：
# - macOS / Windows（Docker Desktop）：内置 host.docker.internal，直接可用
# - Linux：默认不存在该域名，必须靠 extra_hosts 把 host.docker.internal 指到宿主机网关
#   下面两个服务都写了 extra_hosts: ["host.docker.internal:host-gateway"]，
#   这样同一份 prometheus.yml 在三端都不用改，是 Linux 上最省事的做法。
#
# 另一种 Linux 方案是 --network host 或直接写宿主机内网 IP，但前者会丢掉端口映射，
# 后者在换机器（Wi-Fi/办公网切换）后 IP 会变，不适合写进配置仓库。

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rag-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    extra_hosts:
      # Linux 必需的兼容层；Docker Desktop 上写了也无副作用
      - 'host.docker.internal:host-gateway'
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: rag-alertmanager
    ports:
      - '9093:9093'
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    extra_hosts:
      # 通知出口（钉钉/企微 sidecar 或自建接收端）跑在宿主机上时靠它解析
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rag-grafana
    ports:
      # 容器的 3000 会与 RAG 后端 dev 端口冲突，这里映射到宿主机 3030
      - '3030:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # 本地开发免登录看板（只读）；对外暴露时请删掉这两行
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/rag-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

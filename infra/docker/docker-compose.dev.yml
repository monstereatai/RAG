# ============================================================
# RAG 本地开发栈；与 docker-compose.langfuse.yml 合并为同一个 Docker 项目。
# PostgreSQL、Redis、Milvus、Elasticsearch、Langfuse 及各自独立的数据卷均在此项目下。
# 本地端口 5433 用于避开本机已占用的 5432。
# 停止时不要添加 -v，以保留知识库和 Langfuse 数据。
# ============================================================

name: docker

services:
  # ---- Generated Vue / React source preview compiler (host API uses localhost:4321) ----
  preview-runner:
    build:
      context: ../..
      dockerfile: apps/preview-runner/Dockerfile
    container_name: rag-dev-preview-runner
    restart: "no"
    ports:
      - '127.0.0.1:4321:4321'
    environment:
      PORT: 4321
      NODE_ENV: production
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4321/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - preview-net

  # ---- PostgreSQL 16 + pgvector（关系型数据 + 可选向量库）----
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: rag-dev-postgres
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rag']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Redis 7（对话历史 + 缓存）----
  redis:
    image: redis:7.4.9-alpine
    container_name: rag-dev-redis
    restart: "no"
    ports:
      - '6379:6379'
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Milvus 依赖：etcd ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-dev-etcd
    restart: "no"
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - dev_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ['CMD', '/bin/sh', '-c', 'ETCDCTL_API=3 etcdctl endpoint health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Milvus 依赖：minio（对象存储）----
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-dev-minio
    restart: "no"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - '9001:9001'
    volumes:
      - dev_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Milvus 2.4 standalone（向量库）----
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: rag-dev-milvus
    restart: "no"
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - '19530:19530'
      - '9091:9091'
    volumes:
      - dev_milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---- Elasticsearch 8（全文检索，IK 中文分词）----
  elasticsearch:
    image: rag-dev-elasticsearch:8.13.0
    build:
      context: ./elasticsearch
      args:
        ELASTICSEARCH_VERSION: 8.13.0
    container_name: rag-dev-es
    restart: "no"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=rag-dev
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - dev_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9200/_cluster/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---- Neo4j 5（知识图谱 GraphRAG，profile=graphrag 可选启动）----
  neo4j:
    image: neo4j:5.26.27-community
    container_name: rag-dev-neo4j
    restart: "no"
    profiles:
      - graphrag
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - '7474:7474'   # HTTP Browser
      - '7687:7687'   # Bolt
    volumes:
      - dev_neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---- 本地隐私识别（只由 privacy profile 手动启动）----
  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.366
    container_name: rag-dev-presidio-analyzer
    restart: "no"
    profiles:
      - privacy
    ports:
      - '127.0.0.1:5002:3000'

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_etcd_data:
  dev_minio_data:
  dev_milvus_data:
  dev_es_data:
  dev_neo4j_data:

networks:
  preview-net:
    driver: bridge
    internal: true

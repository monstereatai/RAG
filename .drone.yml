kind: pipeline
type: docker
name: rag-ci

steps:
  - name: workspace-check
    image: docker.m.daocloud.io/library/node:22-alpine
    commands:
      - corepack enable
      - corepack prepare pnpm@10.17.1 --activate
      - pnpm install --frozen-lockfile
      - pnpm typecheck
      - pnpm build
      - pnpm test
      - pnpm --filter backend run eval:rag
      - pnpm --filter backend run eval:golden:check
      - pnpm --filter backend run eval:langfuse:check
      - pnpm --filter backend run eval:langfuse:dataset

  - name: docker-build-backend
    image: plugins/docker
    settings:
      dry_run: true
      context: backend
      dockerfile: Dockerfile
      repo: rag-backend
      tags:
        - ci
    depends_on:
      - workspace-check

  - name: docker-build-frontend
    image: plugins/docker
    settings:
      dry_run: true
      context: frontend
      dockerfile: Dockerfile
      repo: rag-frontend
      tags:
        - ci
    depends_on:
      - workspace-check

trigger:
  event:
    - push
    - pull_request

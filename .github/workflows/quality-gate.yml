name: RAG Quality Gate

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir backend run build
      - run: pnpm --dir admin-backend run build
      - run: pnpm --dir backend run enterprise:readiness
      - run: pnpm --dir backend run eval:rag:quality
      - run: pnpm --dir backend run eval:agent-platform

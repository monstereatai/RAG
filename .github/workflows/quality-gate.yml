name: RAG Quality Gate

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/rag-api run build
      - run: pnpm --dir apps/rag-api exec jest --runInBand workflow-dispatch-contract.spec.ts redis-checkpointer.atomic.spec.ts
      - run: pnpm --dir apps/rag-api run test:hardening
      - run: pnpm --dir apps/rag-api exec node --test scripts/lib/verified-golden.platform.test.mjs
      - run: pnpm --dir apps/admin-api run build
      - run: pnpm --dir apps/rag-api run enterprise:readiness
      - run: pnpm --dir apps/rag-api run eval:rag
      - run: pnpm --dir apps/rag-api run eval:golden:check
      - run: pnpm --dir apps/rag-api exec node scripts/build-business-regression-dataset.mjs --check
      - run: pnpm --dir apps/rag-api run eval:agent-platform
      - run: pnpm --dir apps/rag-api run eval:golden-business
